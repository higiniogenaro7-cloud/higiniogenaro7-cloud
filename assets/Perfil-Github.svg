<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d" />
      <stop offset="100%" stop-color="#060d15" />
    </linearGradient>

    
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1c2c" />
      <stop offset="100%" stop-color="#08131f" />
    </linearGradient>

    
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13293f" />
      <stop offset="100%" stop-color="#0d1e30" />
    </linearGradient>

    
    <filter id="glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .title {
      fill: #cbd5e1;
      font-size: 15px;
    }
    .code-line {
      font-size: 18px;
    }
    .key {
      fill: #38bdf8; /* Azul brillante */
    }
    .eq {
      fill: #e2e8f0; /* Blanco suave */
    }
    .val {
      fill: #f59e0b; /* Naranja/ámbar */
    }
  </style>

  
  <rect width="820" height="260" fill="url(#bgGrad)" rx="8" />

  
  <g filter="url(#glow)">
    <rect x="20" y="20" width="780" height="220" rx="14" fill="url(#winGrad)" stroke="#1e4976" stroke-width="2" />
  </g>

  
  <path d="M 21 34 A 13 13 0 0 1 34 21 L 786 21 A 13 13 0 0 1 799 34 L 799 58 L 21 58 Z" fill="url(#headerGrad)" />
  <line x1="20" y1="58" x2="800" y2="58" stroke="#1e4976" stroke-width="1.5" />

  
  <circle cx="44" cy="40" r="5.5" fill="#2d4a66" />
  <circle cx="62" cy="40" r="5.5" fill="#2d4a66" />
  <circle cx="80" cy="40" r="5.5" fill="#2d4a66" />

  
  <text x="104" y="45" class="mono title">.env</text>

  
  
  <text x="44" y="102" class="mono code-line">
    <tspan class="key">NOMBRE</tspan><tspan class="eq">=</tspan><tspan class="val">Genaro Segura Calvo</tspan>
  </text>

  
  <text x="44" y="146" class="mono code-line">
    <tspan class="key">ARCH</tspan><tspan class="eq">=</tspan><tspan class="val">MVC, CLEAN, Micro servicios y API REST</tspan>
  </text>

  
  <text x="44" y="190" class="mono code-line">
    <tspan class="key">TECH</tspan><tspan class="eq">=</tspan><tspan class="val">PHP/Laravel, JAVA/SpringBOOT, .net / C#, REACT y ASTRO</tspan>
  </text>
</svg>